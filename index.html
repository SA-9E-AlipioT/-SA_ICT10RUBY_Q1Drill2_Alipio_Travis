
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Club Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #fff0d9, #f3d0a2);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .main-card {
            max-width: 800px;
            margin: auto;
            background-color: #fffaf2;
            border: 2px solid #b87945;
            border-radius: 20px;
        }

        .page-title {
            color: #7b3f16;
            font-weight: bold;
        }

        .subtitle {
            color: #96613b;
        }

        .form-control {
            border: 1px solid #c49a6c;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #e67e22;
            box-shadow: 0 0 0 0.2rem rgba(230, 126, 34, 0.2);
        }

        .btn-orange {
            background-color: #d96b18;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-orange:hover {
            background-color: #a84c12;
            color: white;
        }

        .member-count {
            color: #c45a12;
            font-size: 32px;
            font-weight: bold;
        }

        .result-box {
            background-color: #fff1df;
            border: 1px solid #d6a16b;
            border-radius: 12px;
            padding: 20px;
            color: #633b20;
            line-height: 1.9;
        }

        .section-title {
            color: #7b3f16;
            font-weight: bold;
        }

        hr {
            border-color: #c49a6c;
        }

        .message {
            color: #a84c12;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="main-card shadow-lg p-4 p-md-5">

            <div class="text-center mb-4">
                <h1 class="page-title">Student Club Manager</h1>
                <p class="subtitle">Manage your club members by grade level.</p>
            </div>

            <h4 class="section-title mb-3">Add a New Member</h4>

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="first_name" class="form-label">First Name</label>
                    <input type="text" id="first_name" class="form-control" placeholder="Enter first name">
                </div>

                <div class="col-md-6">
                    <label for="last_name" class="form-label">Last Name</label>
                    <input type="text" id="last_name" class="form-control" placeholder="Enter last name">
                </div>
            </div>

            <button class="btn btn-orange w-100 mt-3 py-2" py-click="add_member">
                + Add Member
            </button>

            <hr class="my-4">

            <div class="text-center mb-4">
                <h5 class="section-title">Total Club Members</h5>
                <div id="member_count" class="member-count">0</div>
            </div>

            <h4 class="section-title mb-3">All Club Members</h4>

            <div id="member_list" class="result-box"></div>

            <p id="message" class="message mt-3 mb-0"></p>

        </div>
    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
